name: Deploy

# main への push で：
#   1. Supabase に migration を適用（supabase db push）
#   2. Edge Function（verify-passphrase）をデプロイ
#   3. フロントエンドをビルド
#   4. GitHub Pages に公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に複数の deploy が走らないように直列化（migration 競合防止）
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply DB migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link to project
        run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
      - name: Push migrations
        run: supabase db push

  functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    needs: migrate
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy verify-passphrase
        run: |
          supabase functions deploy verify-passphrase \
            --project-ref ${{ vars.SUPABASE_PROJECT_REF }}

  build:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_PUBLIC_SUPABASE_URL }}
          VITE_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, functions]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
