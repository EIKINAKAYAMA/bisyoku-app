name: Supabase Keepalive

# Free Tier プロジェクトは 1 週間 API 無アクセスで自動 Pause される。
# 毎日 1 回 REST API を叩いて生存させる。

on:
  schedule:
    - cron: '0 18 * * *' # 18:00 UTC = 03:00 JST
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Supabase REST
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check secrets
        env:
          SUPABASE_URL: ${{ secrets.VITE_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY not set in repository secrets."
            exit 1
          fi

      - name: Ping health table
        env:
          SUPABASE_URL: ${{ secrets.VITE_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          echo "Pinging $SUPABASE_URL/rest/v1/health"
          response=$(curl --silent --show-error --fail-with-body \
            --max-time 30 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Accept: application/json" \
            "$SUPABASE_URL/rest/v1/health?select=id&limit=1")
          echo "Response: $response"
          echo "OK"
